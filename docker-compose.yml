services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ordem_paranormal_backend
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - HOST=0.0.0.0
      - CORS_ORIGINS=*
    volumes:
      - ./backend/data:/app/data
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ordem_paranormal_frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped
